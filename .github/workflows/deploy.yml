name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate, test, build, and upload
        uses: withastro/action@v6
        with:
          node-version: '24'
          package-manager: pnpm@11.25.0
          build-cmd: pnpm check && pnpm test && pnpm test:site && pnpm build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ vars.SITE_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
